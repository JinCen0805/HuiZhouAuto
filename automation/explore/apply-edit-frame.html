<script type="text/javascript">
    var parentData;
    var applicationData = null;
    var selectedItems = [];
    var selectedTableIns;
    // 申请附件支持多条记录；每次上传成功后追加到列表，不覆盖已有附件。
    var applicationAttachments = [];
    var applicationAttachmentUploader = null;
    var applicationAttachmentUploading = false;
    var saving = false;
    var planType = 1;
    var currentUserInfo = getUserBasicInfo() || {};

    var productQuoteUuid = getQueryParam("productQuoteUuid");
    var productQuoteHandoffApplied = false;

    function getQueryParam(name) {
        var match = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search || "");
        return match ? decodeURIComponent(match[1].replace(/\+/g, " ")) : "";
    }

    function productQuoteItemsText(detail) {
        var items = detail && Array.isArray(detail.items) ? detail.items : [];
        return items.map(function (item) {
            var parts = [item.productName || ""];
            if (item.brand) parts.push("品牌：" + item.brand);
            if (item.model) parts.push("型号：" + item.model);
            parts.push("数量：" + (item.quantity == null ? "" : item.quantity));
            parts.push("单位：" + (item.unit || ""));
            return parts.join("，");
        }).join("；");
    }

    function loadProductQuoteHandoff() {
        if (!productQuoteUuid || productQuoteHandoffApplied) return;
        $.ajax({
            url: "/" + PROJECT_NAME + "/api/productmanagement/quote-invitations/" + encodeURIComponent(productQuoteUuid),
            type: "GET",
            dataType: "json"
        }).done(function (response) {
            if (!response || response.success !== true || !response.data) return;
            var detail = response.data;
            var invitation = detail.invitation || {};
            var submissions = Array.isArray(detail.submissions) ? detail.submissions : [];
            var latest = submissions.length ? submissions[0] : {};
            var suppliers = Array.isArray(detail.suppliers) ? detail.suppliers : [];
            var supplierName = suppliers.length ? suppliers[0].supplierName : "";
            var productNames = (Array.isArray(detail.items) ? detail.items : []).map(function (item) {
                return item.productName || "";
            }).filter(function (name) { return !!name; }).join("、");
            var amount = latest.totalAmount || invitation.latestTotalAmount || "";
            var requestName = "零星采购-" + (productNames || invitation.invitationCode || "");
            var content = productQuoteItemsText(detail);
            content += "；成交供应商：" + (supplierName || "以报价邀请为准");
            if (amount !== "") content += "；报价合计：" + amount + "元";
            var reason = "产品库报价已确认，申请单号：" + (invitation.invitationCode || productQuoteUuid) + "。";
            productQuoteHandoffApplied = true;
            $("[idName='projectName']").val(requestName);
            $("[idName='purchaseContent']").val(content);
            $("[idName='applicationReason']").val(reason);
            $("[idName='projectAttribute']").val("1");
            $("[idName='attributeType']").val("货物类");
            if (planType === 2) {
                $("#attributeType").prop("disabled", false);
            }
            if (typeof form !== "undefined" && form && form.render) form.render("select", "applicationForm");
        });
    }

    function linkProductQuoteRequest(requestId) {
        if (!productQuoteUuid || !requestId) return;
        $.ajax({
            url: "/" + PROJECT_NAME + "/api/productmanagement/quote-invitations/" + encodeURIComponent(productQuoteUuid) + "/procurement-link",
            type: "POST",
            contentType: "application/json;charset=UTF-8",
            data: JSON.stringify({purchaseRequestUuid: requestId, remark: "产品库报价确认后创建采购申请"})
        }).fail(function () {
            HCUI.popDialog.msg("采购申请已保存，但关联产品库报价失败，请稍后重试");
        });
    }
    function __init() {
        parentData = window["HCUI_LAYER_PARAENT_DATA"] || {pageModel: "add"};
        applicationData = parentData.detailData || null;
        planType = Number((applicationData && applicationData.planType) || parentData.planType || 1);
        if (!applicationData && productQuoteUuid) planType = 2;
        if (!applicationData && parentData.uuid) {
            applicationData = ProcurementStaticStore.getApplication(parentData.uuid);
        }
        applicationAttachments = normalizeApplicationAttachments(applicationData);
        initApplicationAttachmentUploader();
        if (applicationData) {
            selectedItems = applicationData.reserveItems || [];
            appCommon.formUtil.fillFormByIdName(".tabViewContent", applicationData);
            $("[idName='requestDepartment']").val(applicationData.requestDepartment || applicationData.demandDepartment || "");
            $("[idName='applicationReason']").val(applicationData.applicationReason || applicationData.reason || applicationData.remark || "");
            normalizeProjectAttributeFormValue();
        } else {
            selectedItems = (parentData.initialReserveItems || []).slice();
            if (selectedItems.length === 1) {
                $("[idName='projectName']").val(selectedItems[0].projectName || "");
            } else if (selectedItems.length > 1) {
                $("[idName='projectName']").val(selectedItems[0].projectName + "等" + selectedItems.length + "项采购申请");
            }
        }
        if (planType === 2) {
            $("#attributeType").prop("disabled", false);
            if (!applicationData) $("[idName='requestDepartment']").val(currentUserInfo.organizationName || "");
        } else {
            // 计划内申请的项目类型和申请科室均由所选预算计划决定，不能由用户手工填写。
            syncInPlanDerivedFields();
        }
        selectedTableIns = HCUI.datagrid(selectedTableOption(selectedItems));
        table.on("tool(selectedReserveTableIndex)", onSelectedReserveBarEvent);
        $("#addReserveBtn").on("click", openReserveEditor);
        form.on("select(projectAttribute)", function (data) {
            toggleProjectAttributeFields(data.value);
        });
        toggleProjectAttributeFields($("[idName='projectAttribute']").val());
        form.render();
        if (planType === 1) {
            // Layui 下拉框的显示文本需要在赋值后重新渲染，否则仍会显示“请选择项目类型”。
            $("#attributeType option[value='']").text("由预算计划自动带出");
            form.render("select", "applicationForm");
        }
        renderSelectedItems();
        renderRejectionOpinion();
        renderApplicationAttachment();
        if (!applicationData && productQuoteUuid) loadProductQuoteHandoff();
    }

    function selectedTableOption(data) {
        return {
            elem: "#selectedReserveTable", id: "selectedReserveTable", height: "auto", page: false, isOrderNum: false, data: data,
            cols: [[
                {field: "budgetCode", title: "预算代码", width: 150},
                {field: "projectName", title: "预计划名称", width: 240},
                {field: "year", title: "预算年度", width: 95, align: "center"},
                {field: "attributeType", title: "项目类型", width: 100, align: "center"},
                {field: "ownerDepartment", title: "归口职能部办", width: 130},
                {field: "fundSource", title: "资金来源", width: 110},
                {field: "totalAmount", title: "预算金额（元）", width: 150, align: "right", formatter: function (value) { return ProcurementStaticStore.formatMoney(value); }},
            {field: "handle", title: "操作", width: 130, fixed: "right", align: "center", formatter: reserveOperationFormatter}
            ]]
        };
    }

    function renderSelectedItems() {
        var total = selectedItems.reduce(function (sum, row) { return sum + Number(row.totalAmount || 0); }, 0);
        var types = [];
        for (var i = 0; i < selectedItems.length; i++) {
            if (types.indexOf(selectedItems[i].attributeType) === -1) types.push(selectedItems[i].attributeType);
        }
        var applicationProjectType = getApplicationProjectType();
        var attribute = applicationProjectType || (types.length ? types[0] : "");
        $("[idName='attributeType']").val(attribute);
        if (planType === 1) {
            syncInPlanDerivedFields();
        }
        $("#selectedCount").text(selectedItems.length);
        $("#selectedAmount").text(ProcurementStaticStore.formatMoney(total));
        updateReserveEditability();
        if (selectedTableIns) selectedTableIns.reload({data: selectedItems});
    }

    /**
     * 计划内申请的派生字段：
     * 1. 项目类型取首个预算计划的项目类型；
     * 2. 申请科室取首个预算计划的归口职能部办；
     * 3. 页面控件始终保持只读/禁用，避免用户填写与预算计划不一致的数据。
     */
    function syncInPlanDerivedFields() {
        if (planType !== 1) return;
        var firstReserve = selectedItems && selectedItems.length ? selectedItems[0] : {};
        var projectType = ProcurementApplyApi.projectTypeValue(
            firstReserve.attributeType || firstReserve.projectType ||
            (applicationData && (applicationData.attributeType || applicationData.projectType))
        );
        var projectTypeLabel = projectType ? ProcurementApplyApi.projectTypeLabel(projectType) :
            String($("[idName='attributeType']").val() || "");
        var departmentName = String(currentUserInfo.organizationName ||
            (applicationData && applicationData.requestDepartment) ||
            firstReserve.ownerDepartment ||
            $("[idName='requestDepartment']").val() || "").replace(/^\s+|\s+$/g, "");
        $("[idName='attributeType']").val(projectTypeLabel);
        $("[idName='requestDepartment']").val(departmentName);
        $("#attributeType").prop("disabled", true);
        $("[idName='requestDepartment']").prop("readonly", true);
        if (typeof form !== "undefined" && form && typeof form.render === "function") {
            form.render("select", "applicationForm");
        }
    }

    function isRejectedApplication() {
        return !!applicationData && (Number(applicationData.status) === 2 || Number(applicationData.status) === 6);
    }

    /**
     * 新建（未落库）、草稿、已驳回待修改均可移除关联预算计划（纠正误选）。
     * status 缺失时按草稿处理，避免保存草稿后未回填 status 再次误拦。
     */
    function canRemoveLinkedReserve() {
        if (!applicationData) {
            return true;
        }
        if (parentData && parentData.pageModel === "add" && !applicationData.uuid) {
            return true;
        }
        var status = Number(applicationData.status);
        if (isNaN(status) || status === 0) {
            return true;
        }
        return isRejectedApplication();
    }

    function updateReserveEditability() {
        // 只有需求科室发起人可以维护计划外预算计划；承办部门干事等其他角色不显示此按钮。
        if (!isRequestStaffUser()) {
            $("#addReserveBtn").hide()
                .attr("aria-hidden", "true")
                .attr("aria-disabled", "true");
            return;
        }
        $("#addReserveBtn").show()
            .attr("aria-hidden", "false");
        var editable = planType === 2 ? canRemoveLinkedReserve() : isRejectedApplication();
        var button = $("#addReserveBtn");
        button.toggleClass("operation-disabled", !editable)
            .attr("aria-disabled", editable ? "false" : "true")
            .attr("title", editable ? (planType === 2 ? "新增计划外预算计划" : "新增当前项目类型的未引用预算计划") : "当前状态不能新增预算计划");
    }

    function isRequestStaffUser() {
        return String(currentUserInfo && currentUserInfo.roleCode || "").replace(/^\s+|\s+$/g, "") === "REQ_STAFF";
    }

    function reserveOperationFormatter(value, option, row) {
        var editable = canRemoveLinkedReserve();
        if (!editable) {
            return '<button class="layui-btn layui-btn-primary layui-btn-mini operation-disabled" type="button" ' +
                'lay-event="blockedRemove" aria-disabled="true" title="当前状态不能删除预算计划">删除</button>';
        }
        var editButton = planType === 2 ? '<button class="layui-btn layui-btn-mini" type="button" lay-event="editReserve" style="margin-right: 8px;">编辑</button>' : '';
        return editButton + '<button class="layui-btn layui-btn-mini" type="button" lay-event="remove">删除</button>';
    }

    function onSelectedReserveBarEvent(obj) {
        if (obj.event === "blockedRemove") {
            HCUI.popDialog.msg("当前状态不能删除预算计划");
            return;
        }
        if (obj.event === "editReserve" && planType === 2) {
            openOutsidePlanReserveEditor(obj.data);
            return;
        }
        if (obj.event !== "remove") return;
        if (!canRemoveLinkedReserve()) {
            HCUI.popDialog.msg("当前状态不能删除预算计划");
            return;
        }
        HCUI.popDialog.confirm("移除该预算计划后，点击保存草稿才会生效，确定继续吗？", function () {
            var uuid = String(obj.data && (obj.data.uuid || obj.data.localKey) || "");
            selectedItems = selectedItems.filter(function (item) {
                return String(item.uuid || item.localKey || "") !== uuid;
            });
            renderSelectedItems();
        });
    }

    function openReserveEditor() {
        if (!isRequestStaffUser()) {
            return;
        }
        if (planType === 2) {
            openOutsidePlanReserveEditor(null);
            return;
        }
        openReserveSelector();
    }

    function openReserveSelector() {
        if (!isRejectedApplication()) {
            HCUI.popDialog.msg("只有已驳回待修改的申请可以新增预算计划");
            return;
        }
        var projectType = ProcurementApplyApi.projectTypeValue(applicationData.projectType);
        if (!projectType) {
            HCUI.popDialog.msg("当前申请单缺少有效项目类型，无法新增预算计划");
            return;
        }
        HCUI.popDialog({
            name: "procurementReserveSelector",
            title: "新增预算计划",
            area: ["96%", "88%"],
            content: "/" + PROJECT_NAME + "/view/procurementApply/reserveSelect.html",
            parentData: {
                projectType: projectType,
                governmentProcurement: ProcurementApplyApi.governmentProcurementValue(
                    selectedItems[0] && selectedItems[0].governmentProcurement
                ),
                existingIds: selectedItems.map(function (item) { return item.uuid; }),
                onSuccess: function (rows) {
                    var existingIds = selectedItems.map(function (item) { return String(item.uuid); });
                    for (var i = 0; i < rows.length; i++) {
                        if (existingIds.indexOf(String(rows[i].uuid)) === -1) {
                            selectedItems.push(rows[i]);
                            existingIds.push(String(rows[i].uuid));
                        }
                    }

                }
            },

                win.confirmSelection();
                return false;
            }, function () { return true; }]
        });

    function openOutsidePlanReserveEditor(reserveData) {
        var editable = !applicationData || Number(applicationData.status) === 0 || isRejectedApplication();
        if (!editable) { HCUI.popDialog.msg("当前状态不能维护预算计划"); return; }
        var attributeType = $("[idName='attributeType']").val();
        if (!ProcurementApplyApi.projectTypeValue(attributeType)) {
            HCUI.popDialog.msg("请先选择采购申请项目类型");
            return;
        }
        HCUI.popDialog({
            name: "outsidePlanReserveEdit",
            title: reserveData ? "编辑计划外预算计划" : "新增计划外预算计划",
            area: ["96%", "92%"],
            content: "/" + PROJECT_NAME + "/view/procurementApply/outsidePlanReserveEdit.html",
            parentData: {
                attributeType: attributeType,
                reserveData: reserveData || {},
                governmentProcurement: lockedOutsidePlanGovernmentProcurement(reserveData)
            },
            firstBtnSubmit: false,
            btn: ["保存", "取消"],
            btnFun: [function (index) {
                var win = HCUI.popDialog.getLayerWindow({name: "outsidePlanReserveEdit"});
                if (!win || typeof win.buildOutsidePlanReserve !== "function") return false;
                var item = win.buildOutsidePlanReserve();
                if (!item) return false;
                var key = String(item.uuid || item.localKey);
                var nextItems = selectedItems.slice();
                var replaced = false;
                for (var i = 0; i < nextItems.length; i++) {
                    if (String(nextItems[i].uuid || nextItems[i].localKey) === key) {
                        nextItems[i] = item;
                        replaced = true;
                        break;
                    }
                }
                if (!replaced) nextItems.push(item);
                var governmentProcurementError = ProcurementApplyApi.governmentProcurementConsistencyError(nextItems);
                if (governmentProcurementError) {
                    HCUI.popDialog.msg(governmentProcurementError);
                    return false;
                }
                var smeReserveError = ProcurementApplyApi.smeReserveConsistencyError(nextItems);
                if (smeReserveError) {
                    HCUI.popDialog.msg(smeReserveError);
                    return false;
                }
                selectedItems = nextItems;
                renderSelectedItems();
                HCUI.popDialog.closeIframeSelf(index);
                return false;
            }]
        });
    }

    function renderRejectionOpinion() {
        var visible = isRejectedApplication();
        var opinion = applicationData && applicationData.rejectReason || "";
        $("#rejectInfoSection").toggleClass("is-visible", visible);
        $("[idName='rejectUserName']").val(applicationData && applicationData.rejectUserName || "");
        $("[idName='rejectReason']").val(opinion || "");

    function lockedOutsidePlanGovernmentProcurement(reserveData) {
        var currentKey = String((reserveData && (reserveData.uuid || reserveData.localKey)) || "");
        for (var i = 0; i < selectedItems.length; i++) {
            var itemKey = String(selectedItems[i].uuid || selectedItems[i].localKey || "");
            if (currentKey && itemKey === currentKey) continue;
            var value = ProcurementApplyApi.governmentProcurementValue(selectedItems[i].governmentProcurement);
            if (value) return value;
        }
        return "";

    function getApplicationProjectType() {
        if (!applicationData) return "";
        if (ProcurementApplyApi.projectTypeValue(applicationData.projectType)) {
            return ProcurementApplyApi.projectTypeLabel(applicationData.projectType);
        }
        if (ProcurementApplyApi.projectTypeValue(applicationData.attributeType)) {
            return ProcurementApplyApi.projectTypeLabel(
                ProcurementApplyApi.projectTypeValue(applicationData.attributeType)
            );
        }
        return "";
    }

    function toggleProjectAttributeFields(value) {
        var projectAttribute = String(value || "");
        $("#repairAttributeFields").toggleClass("is-visible", projectAttribute === "3");
    }

    function normalizeProjectAttributeFormValue() {
        var selected = $("[idName='projectAttribute']");
        if (String(selected.val()) !== "5") return;
        selected.val("9");
        var remark = $("[idName='projectAttributeRemark']");
        if (!String(remark.val() || "").replace(/^\s+|\s+$/g, "")) {
            remark.val("院外政府招标");
        }
    }

    function normalizeApplicationAttachments(source) {
        if (!source) return [];
        var rows = source.attachments || source.attachmentList || source.applicationAttachments || source.fileList || [];
        if (Object.prototype.toString.call(rows) !== "[object Array]") rows = [source];
        var result = [];
        for (var i = 0; i < rows.length; i++) {
            var item = rows[i] || {};
            var name = item.attachmentName || item.fileName || item.name || "";
            if (!name) continue;
            var type = item.attachmentType || item.fileType || applicationAttachmentType(name, item);
            var fileId = item.fileServerIdentificationNumber || item.fileId || item.attachmentId || item.attachmentUuid || "";
            result.push({
                name: name,
                type: type,
                mimeType: item.mimeType || item.contentType || "",
                fileId: fileId,
                attachmentSize: item.attachmentSize || item.fileSize || item.size,
                downloadUrl: item.downloadUrl || item.url || (fileId ? "/doFile/download/?attachmentId=" + encodeURIComponent(fileId) : ""),
                previewUrl: item.previewUrl || ""
            });
        }
        return result;
    }

    function getApplicationAttachmentData() {
        var result = [];
        for (var i = 0; i < applicationAttachments.length; i++) {
            var attachment = applicationAttachments[i];
            if (!attachment || !attachment.fileId) continue;
            var item = {
                attachmentName: attachment.name,
                attachmentType: attachment.type,
                fileId: attachment.fileId
            };
            if (attachment.attachmentSize !== undefined && attachment.attachmentSize !== null) {
                item.attachmentSize = attachment.attachmentSize;
            }
            result.push(item);
        }
        return result;
    }

    function renderApplicationAttachment() {
        var html = '';
        if (!applicationAttachments.length) {
            html = '<tr><td><span class="empty-value">/</span></td><td><span class="empty-value">/</span></td>' +
                '<td><button class="layui-btn layui-btn-mini" type="button" onclick="triggerApplicationAttachmentUpload()">上传</button></td></tr>';
        } else {
            for (var i = 0; i < applicationAttachments.length; i++) {
                var attachment = applicationAttachments[i];
                html += '<tr>' +
                    '<td><span class="attachment-name-cell" title="' + ProcurementStaticStore.escapeHtml(attachment.name) + '">' +
                    ProcurementStaticStore.escapeHtml(attachment.name) + '</span></td>' +
                    '<td>' + ProcurementStaticStore.escapeHtml(attachment.type || "未知") + '</td>' +
                    '<td><div class="operation-group">' +
                    '<button class="layui-btn layui-btn-mini" type="button" onclick="previewApplicationAttachment(' + i + ')">查看</button>' +
                    '<button class="layui-btn layui-btn-mini" type="button" onclick="triggerApplicationAttachmentUpload()">' +
                    (applicationAttachmentUploading ? '上传中' : '继续上传') + '</button>' +
                    '<button class="layui-btn layui-btn-mini" type="button" onclick="deleteApplicationAttachment(' + i + ')">删除</button>' +
                    '</div></td></tr>';
            }
        }
        $("#applicationAttachmentBody").html(html);
    }

    function triggerApplicationAttachmentUpload() {
        if (applicationAttachmentUploading) {
            HCUI.popDialog.msg("附件正在上传，请稍候");
            return;
        }
        if (!applicationAttachmentUploader) {
            HCUI.popDialog.msg("文件上传组件初始化失败");
            return;
        }
        var files = applicationAttachmentUploader.getFiles();
        for (var i = 0; i < files.length; i++) {
            applicationAttachmentUploader.removeFile(files[i], true);
        }
        $("#applicationAttachmentFilePicker input").trigger("click");
    }

    function initApplicationAttachmentUploader() {
        applicationAttachmentUploader = fileUploadInit({
            uploaderId: "applicationAttachmentUploader",
            filePicker: "applicationAttachmentFilePicker",
            uploadBtn: "applicationAttachmentUploadBtn",
            uploadTableEnable: false,
            config: {
                multiple: true,
                fileNumLimit: 20,
                fileSizeLimit: 150 * 1024 * 1024,
                fileSingleSizeLimit: 150 * 1024 * 1024,
                accept: {
                    title: "PDF/Word",
                    extensions: "pdf,doc,docx",
                    mimeTypes: "application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                }
            },
            fileQueued: function () {
                applicationAttachmentUploading = true;
                renderApplicationAttachment();
            },
            filesQueued: function () {
                applicationAttachmentUploader.upload();
            },
            uploadSuccess: function (file) {
                applicationAttachments.push({
                    name: file.name || "未命名文件",
                    type: applicationAttachmentType(file.name, file),
                    mimeType: file.type || "",
                    fileId: file.uploadFileId,
                    attachmentSize: file.size,
                    downloadUrl: "/doFile/download/?attachmentId=" + encodeURIComponent(file.uploadFileId),
                    previewUrl: ""
                });
                applicationAttachmentUploader.removeFile(file, true);
                renderApplicationAttachment();
                HCUI.popDialog.msg("附件上传成功");
            },
            uploadError: function (file) {
                applicationAttachmentUploader.removeFile(file, true);
                renderApplicationAttachment();
                HCUI.popDialog.msg("附件上传失败，请重试");
            },
            uploadAccept: function (object, response) {
                if (response && response.success === true) return;
                renderApplicationAttachment();
            },
            uploadFinished: function () {
                applicationAttachmentUploading = false;
                renderApplicationAttachment();
            }
        });
    }

    function applicationAttachmentType(fileName, file) {
        var match = String(fileName || "").match(/\.([^.]+)$/);
        if (match && match[1]) return match[1].toUpperCase();
        return file && file.type ? file.type : "未知";
    }

    function previewApplicationAttachment(index) {
        var applicationAttachment = applicationAttachments[Number(index)];
        if (!applicationAttachment) {
            HCUI.popDialog.msg("请先上传附件");
            return;
        }
        if (!ProcurementApplyApi.isPreviewableApplicationAttachment(applicationAttachment)) {
            HCUI.popDialog.msg("当前仅支持 PDF、DOC、DOCX 文件在线预览");
            return;
        }
        if (ProcurementApplyApi.isWordApplicationAttachment(applicationAttachment)) {
            var convertUrl = ProcurementApplyApi.attachmentPreviewUrl(applicationAttachment);
            if (!convertUrl) {
                HCUI.popDialog.msg("当前浏览器无法预览该附件");
                return;
            }
            loadApplicationAttachmentPreview(convertUrl);
            return;
        }
        var previewUrl = applicationAttachment.previewUrl || "";
        if (previewUrl) {
            openApplicationAttachmentPreview(previewUrl);
            return;
        }
        var downloadUrl = applicationAttachment.downloadUrl || (applicationAttachment.fileId ?
            "/doFile/download/?attachmentId=" + encodeURIComponent(applicationAttachment.fileId) : "");
        if (!downloadUrl) {
            HCUI.popDialog.msg("当前浏览器无法预览该附件");
            return;
        }
        loadApplicationAttachmentPreview(downloadUrl);
    }

    function loadApplicationAttachmentPreview(downloadUrl) {
        var request = new XMLHttpRequest();
        request.open("GET", downloadUrl, true);
        request.responseType = "blob";
        request.onload = function () {
            var blob = request.response;
            if (request.status < 200 || request.status >= 300 || !blob || !blob.size) {
                HCUI.popDialog.msg("获取附件预览失败");
                return;
            }
            openApplicationAttachmentPreview(window.URL.createObjectURL(blob));
        };
        request.onerror = function () {
            HCUI.popDialog.msg("获取附件预览失败");
        };
        request.send();
    }

    function openApplicationAttachmentPreview(previewUrl) {
        var revokeUrl = /^blob:/i.test(previewUrl || "") ? previewUrl : "";
        HCUI.popDialog({
            name: "applicationAttachmentPreview",
            title: "PDF 预览",
            area: ["85%", "90%"],
            firstBtnSubmit: false,
            content: "/" + PROJECT_NAME + "/components/pdfjs/web/viewer.html?file=" +
                encodeURIComponent(previewUrl),
            closeFun: function () {
                if (revokeUrl && window.URL && window.URL.revokeObjectURL) {
                    window.URL.revokeObjectURL(revokeUrl);
                }
            }
        });
    }

    function deleteApplicationAttachment(index) {
        if (applicationAttachmentUploading) {
            HCUI.popDialog.msg("附件正在上传，请稍候");
            return;
        }
        var attachmentIndex = Number(index);
        if (isNaN(attachmentIndex) || !applicationAttachments[attachmentIndex]) {
            HCUI.popDialog.msg("请先上传附件");
            return;
        }
        HCUI.popDialog.confirm("确定删除该附件吗？", function () {
            revokeApplicationAttachmentUrl(applicationAttachments[attachmentIndex]);
            applicationAttachments.splice(attachmentIndex, 1);
            renderApplicationAttachment();
        });
    }

    function revokeApplicationAttachmentUrl(attachment) {
        if (attachment && /^blob:/i.test(attachment.previewUrl || "") &&
            window.URL && window.URL.revokeObjectURL) {
            window.URL.revokeObjectURL(attachment.previewUrl);
        }
    }

    function validateForm(param) {
        var required = [
            ["projectName", "请输入项目名称"],
            ["projectAttribute", "请选择项目属性"],
            ["purchaseContent", "请填写采购内容或需求说明"],
            ["applicationReason", "请填写申请理由"]
        ];
        for (var i = 0; i < required.length; i++) {
            if (!param[required[i][0]]) {
                HCUI.popDialog.msg(required[i][1]);
                return false;
            }
        }
        var selectedProjectType = selectedItems.length ? ProcurementApplyApi.projectTypeValue(
            selectedItems[0].attributeType || selectedItems[0].projectType
        ) : 0;
        if (planType === 1 && selectedProjectType) {
            // 计划内项目类型由预算计划决定，保存前再次从首个预算计划回填，避免禁用控件未被表单工具读取。
            param.attributeType = ProcurementApplyApi.projectTypeLabel(selectedProjectType);
        }
        if (!ProcurementApplyApi.projectTypeValue(param.attributeType)) {
            HCUI.popDialog.msg(planType === 1 ? "请先选择有效的计划内预算计划" : "请选择有效的项目类型");
            return false;
        }
        if (String(param.projectAttribute) === "3") {
            var repairRequired = [
                ["repairEquipmentModel", "请输入维修设备型号或规格"],
                ["repairManufacturer", "请输入维修设备生产厂家"],
                ["repairOriginalValue", "请输入维修设备原值"],
                ["repairEquipmentCode", "请输入设备编号或资产编号"]
            ];
            for (var repairIndex = 0; repairIndex < repairRequired.length; repairIndex++) {
                if (!param[repairRequired[repairIndex][0]]) {
                    HCUI.popDialog.msg(repairRequired[repairIndex][1]);
                    return false;
                }
            }
        }
        if (!selectedItems.length) {
            HCUI.popDialog.msg(planType === 2 ? "请至少新增一个计划外预算计划" : "请至少选择一个有效预算计划");
            return false;
        }
        var applicationProjectType = ProcurementApplyApi.projectTypeValue(param.attributeType);
        for (var selectedIndex = 0; selectedIndex < selectedItems.length; selectedIndex++) {
            var reserveProjectType = ProcurementApplyApi.projectTypeValue(
                selectedItems[selectedIndex].attributeType || selectedItems[selectedIndex].projectType
            );
            if (!reserveProjectType || reserveProjectType !== applicationProjectType) {
                HCUI.popDialog.msg("关联预算计划的项目类型必须与申请单项目类型一致");
                return false;
            }
        }
        var governmentProcurementError = ProcurementApplyApi.governmentProcurementConsistencyError(selectedItems);
        if (governmentProcurementError) {
            HCUI.popDialog.msg(governmentProcurementError);
            return false;
        }
        var smeReserveError = ProcurementApplyApi.smeReserveConsistencyError(selectedItems);
        if (smeReserveError) {
            HCUI.popDialog.msg(smeReserveError);
            return false;
        }
        return true;
    }

    function saveApplication(successCallback) {
        if (saving) return false;
        if (applicationAttachmentUploading) {
            HCUI.popDialog.msg("附件正在上传，请等待上传完成后再保存");
            return false;
        }
        $("[idName='code'],[idName='attributeType']").attr("disabled", false);
        var param = appCommon.formUtil.getParamByIdName(".tabViewContent");
        $("[idName='code'],[idName='attributeType']").attr("disabled", true);
        if (!validateForm(param)) return false;
        saveDraft(param, successCallback);
        return false;
    }

    function saveDraft(param, successCallback) {
        var requestId = applicationData && applicationData.uuid ? applicationData.uuid : parentData.uuid;
        var payload = ProcurementApplyApi.buildDraftPayload(
            param, selectedItems, requestId, getApplicationAttachmentData(), planType
        );
        saving = true;
        ProcurementApplyApi.saveDraft(payload).done(function (response) {
            if (!response || response.success !== true) {
                HCUI.popDialog.msg(response && (response.msg || response.message) ?
                    (response.msg || response.message) : "保存采购申请草稿失败");
                return;
            }
            applicationData = $.extend({}, applicationData || {}, param, {
                uuid: (typeof response.data === "string" ? response.data : (response.data && response.data.uuid))
                    || payload.uuid || "",
                reserveItems: selectedItems.slice(),
                planType: planType,
                status: 0,
                attachments: getApplicationAttachmentData()
            });
            renderSelectedItems();
            linkProductQuoteRequest(applicationData.uuid);
            HCUI.popDialog.msg(response.msg || "采购申请草稿保存成功");
            if (typeof successCallback === "function") successCallback(applicationData);
        }).fail(function (xhr, textStatus, errorThrown) {
            var response = xhr && xhr.responseJSON;
            var message = response && (response.msg || response.message) ? (response.msg || response.message) :
                (textStatus === "timeout" ? "保存请求超时，请稍后重试" : "保存采购申请草稿失败，请稍后重试");
            if (errorThrown && errorThrown.message) message = errorThrown.message;
            HCUI.popDialog.msg(message);
        }).always(function () {
            saving = false;
        });
    }

    function getSavedApplication() {
        return applicationData;
    }
</script>
